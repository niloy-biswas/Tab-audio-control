<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tab Audio Control</title>
    <style>
      body {
        margin: 0;
        padding: 14px;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
          sans-serif;
        color: #1d1d1f;
        -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(
            140px 140px at 12% 8%,
            rgba(110, 170, 255, 0.6),
            transparent 70%
          ),
          radial-gradient(
            160px 160px at 92% 0%,
            rgba(255, 140, 200, 0.5),
            transparent 70%
          ),
          radial-gradient(
            180px 180px at 60% 100%,
            rgba(140, 255, 190, 0.45),
            transparent 70%
          ),
          #d7d9de;
      }

      #panel {
        width: 300px;
        max-height: 420px;
        overflow-y: auto;
        overflow-x: hidden;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.55);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        backdrop-filter: blur(24px) saturate(180%);
        border: 0.5px solid rgba(255, 255, 255, 0.5);
        box-shadow:
          0 8px 30px rgba(0, 0, 0, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
        padding: 10px 0 6px;
      }

      h1 {
        font-size: 11px;
        font-weight: 600;
        margin: 4px 16px 8px;
        color: rgba(60, 60, 67, 0.6);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      hr {
        border: none;
        border-top: 0.5px solid rgba(0, 0, 0, 0.12);
        margin: 6px 0;
      }

      #empty {
        font-size: 12.5px;
        color: rgba(60, 60, 67, 0.5);
        padding: 10px 16px 14px;
      }

      #tabList {
        padding: 2px 0 6px;
      }

      .track {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 7px 16px;
      }

      .track-line {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .track img {
        width: 20px;
        height: 20px;
        flex: none;
        border-radius: 5px;
        object-fit: cover;
        background: rgba(0, 0, 0, 0.06);
      }

      .track-title {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .track-mic-label {
        flex: none;
      }

      .track-pct {
        flex: none;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: rgba(60, 60, 67, 0.45);
        width: 30px;
        text-align: right;
      }

      .track-slider {
        flex: 1 1 96px;
        min-width: 72px;
      }

      .device-control {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .device-select {
        flex: 1 1 auto;
        min-width: 0;
        font: 12.5px -apple-system, system-ui, sans-serif;
        color: #1d1d1f;
        background: rgba(0, 0, 0, 0.05);
        border: none;
        border-radius: 6px;
        padding: 4px 6px;
      }

      .grant-pill {
        flex: none;
        font: 600 11.5px -apple-system, system-ui, sans-serif;
        color: #fff;
        background: #007aff;
        border: none;
        border-radius: 999px;
        padding: 4px 10px;
        cursor: pointer;
      }

      .grant-hint {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 11px;
        color: rgba(60, 60, 67, 0.45);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          to right,
          #007aff 0%,
          #007aff var(--pct, 100%),
          rgba(60, 60, 67, 0.16) var(--pct, 100%),
          rgba(60, 60, 67, 0.16) 100%
        );
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #fff;
        box-shadow:
          0 0 0 0.5px rgba(0, 0, 0, 0.1),
          0 1px 3px rgba(0, 0, 0, 0.3);
        cursor: pointer;
        margin-top: -5.5px;
      }

      input[type="range"]::-moz-range-track {
        height: 4px;
        border-radius: 2px;
        background: rgba(60, 60, 67, 0.16);
      }

      input[type="range"]::-moz-range-progress {
        height: 4px;
        border-radius: 2px;
        background: #007aff;
      }

      input[type="range"]::-moz-range-thumb {
        width: 15px;
        height: 15px;
        border: none;
        border-radius: 50%;
        background: #fff;
        box-shadow:
          0 0 0 0.5px rgba(0, 0, 0, 0.1),
          0 1px 3px rgba(0, 0, 0, 0.3);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>Playing Tabs</h1>
      <hr />
      <div id="empty">No tabs playing audio right now.</div>
      <div id="tabList"></div>
      <hr />
      <h1>Microphone</h1>
      <div class="track">
        <div class="track-line" id="micRow"></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
