<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Master icon (32/48/128). Faders = per-tab volume; colors echo the popup. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fb0ff"/>
      <stop offset="1" stop-color="#0062e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#ff8cc8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8cc8" stop-opacity="0"/>
    </radialGradient>
    <filter id="knob" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#001a4d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#glow)"/>
  <g stroke-linecap="round" stroke-width="9">
    <g stroke="#fff" stroke-opacity="0.35">
      <line x1="40" y1="34" x2="40" y2="94"/>
      <line x1="64" y1="34" x2="64" y2="94"/>
      <line x1="88" y1="34" x2="88" y2="94"/>
    </g>
    <g stroke="#fff">
      <line x1="40" y1="56" x2="40" y2="94"/>
      <line x1="64" y1="76" x2="64" y2="94"/>
      <line x1="88" y1="44" x2="88" y2="94"/>
    </g>
  </g>
  <g fill="#fff" filter="url(#knob)">
    <circle cx="40" cy="56" r="11"/>
    <circle cx="64" cy="76" r="11"/>
    <circle cx="88" cy="44" r="11"/>
  </g>
</svg>
